<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='7' fill='%23ffc803' stroke='%2317141b' stroke-width='2.5'/%3E%3Cpath d='M8.8 23.4l.8-3.6 9.4-9.3c.5-.5 1.3-.5 1.8 0l1.4 1.4c.5.5.5 1.3 0 1.8l-9.4 9.3-4 .4Z' fill='none' stroke='%2317141b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M17.9 11.9l3 3' stroke='%2317141b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff6e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14121c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PDFly — edit PDFs in your browser. Compress, sign, merge, OCR and more. Files never leave your device. Free forever."
    />
    <title>PDFly — Edit PDFs in your browser</title>
    <script>
      // Apply theme before first paint to avoid flash (kept in sync with src/hooks/useTheme.ts).
      try {
        var t =
          localStorage.getItem('pdfly-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
